name: Upgrade Next.js for Railway

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/upgrade-next-railway.yml'

permissions:
  contents: write

jobs:
  upgrade-next:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: webapp/package-lock.json
      - name: Upgrade Next.js to patched 14.2.35
        working-directory: webapp
        run: npm install next@14.2.35 --save-exact
      - name: Verify installed Next.js version
        working-directory: webapp
        run: npm ls next
      - name: Commit package manifest and lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add webapp/package.json webapp/package-lock.json
          if git diff --cached --quiet; then
            echo "No dependency changes required"
            exit 0
          fi
          git commit -m "security: upgrade Next.js to 14.2.35 for Railway"
          git push origin main
