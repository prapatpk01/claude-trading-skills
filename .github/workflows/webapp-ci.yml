name: Sentinel Webapp CI

on:
  pull_request:
    paths:
      - "webapp/**"
      - ".github/workflows/webapp-ci.yml"
  push:
    branches:
      - main
    paths:
      - "webapp/**"
      - ".github/workflows/webapp-ci.yml"

concurrency:
  group: sentinel-webapp-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: webapp
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: webapp/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build
