name: Sentinel Production Research Smoke

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sentinel-production-research-smoke
  cancel-in-progress: true

jobs:
  railway-research-health:
    runs-on: ubuntu-latest
    timeout-minutes: 24
    steps:
      - name: Wait for Railway and verify Stage A providers
        env:
          HEALTH_URL: https://claude-trading-skills-production.up.railway.app/api/system/research-health
        shell: bash
        run: |
          set -uo pipefail
          for attempt in $(seq 1 32); do
            echo "Attempt ${attempt}/32 — ${HEALTH_URL}"
            code=$(curl -sS -L --connect-timeout 10 --max-time 75 -o /tmp/research-health.json -w '%{http_code}' "$HEALTH_URL" || true)
            echo "HTTP ${code}"
            cat /tmp/research-health.json 2>/dev/null || true
            echo

            if [[ "$code" == "200" || "$code" == "206" || "$code" == "503" ]]; then
              if python - <<'PY'
          import json, sys
          from pathlib import Path

          path = Path('/tmp/research-health.json')
          try:
              payload = json.loads(path.read_text())
          except Exception as exc:
              print(f'Not JSON yet: {exc}')
              sys.exit(1)

          required = {'provider', 'sampleRequested', 'sampleScanned', 'coveragePct', 'policy'}
          if not required.issubset(payload):
              print(f'Old/non-health response; missing {sorted(required - set(payload))}')
              sys.exit(1)

          print('Research runtime provider:', payload.get('provider'))
          print('Research runtime coverage:', f"{payload.get('sampleScanned')}/{payload.get('sampleRequested')} ({payload.get('coveragePct')}%)")
          print('Warnings:', payload.get('warnings', []))

          coverage = float(payload.get('coveragePct') or 0)
          scanned = int(payload.get('sampleScanned') or 0)
          requested = int(payload.get('sampleRequested') or 0)
          policy = str(payload.get('policy') or '')
          if scanned <= 0 or requested <= 0:
              print('FAIL: Stage A returned no measured market data.')
              sys.exit(2)
          if coverage < 80:
              print('FAIL: Production Stage A coverage is below the 80% evidence floor.')
              sys.exit(3)
          if 'no fabricated market data' not in policy:
              print('FAIL: DATA_LIMITED/no-fabrication policy marker is missing.')
              sys.exit(4)
          print('PASS: Railway Stage A provider chain is live with >=80% measured coverage.')
          PY
              then
                exit 0
              fi
            fi

            if [[ "$attempt" -lt 32 ]]; then sleep 15; fi
          done

          echo 'FAIL: Railway research-health did not reach a valid >=80% Stage A response within the deployment window.' >&2
          exit 1

      - name: Prove INV V40 discovery and buy-alert guardrails
        env:
          BASE_URL: https://claude-trading-skills-production.up.railway.app
        shell: bash
        run: |
          set -euo pipefail
          URL="$BASE_URL/api/research/dual-discovery?top=5&theme=ai-infrastructure"
          ready=0

          for attempt in $(seq 1 8); do
            echo "V40 production attempt ${attempt}/8"
            code=$(curl -sS -L --connect-timeout 10 --max-time 210 -o /tmp/v40.json -w '%{http_code}' "$URL" || true)
            echo "HTTP ${code}"
            if [[ "$code" == "200" ]] && python - <<'PY'
          import json, sys
          from pathlib import Path
          try:
              payload=json.loads(Path('/tmp/v40.json').read_text())
          except Exception as exc:
              print('Not JSON:', exc)
              sys.exit(1)
          sys.exit(0 if str(payload.get('version','')).startswith('40.') else 1)
          PY
            then
              ready=1
              break
            fi
            cat /tmp/v40.json 2>/dev/null | head -c 2500 || true
            echo
            sleep 15
          done

          if [[ "$ready" != "1" ]]; then
            echo 'FAIL: Railway never returned INV Research V40 dual discovery.' >&2
            exit 10
          fi

          python - <<'PY'
          import json, sys
          from pathlib import Path

          p=json.loads(Path('/tmp/v40.json').read_text())
          momentum=p.get('momentum') or []
          thesis=p.get('thesis') or []
          combined=p.get('combined') or []
          universe=p.get('universe') or {}
          policy=p.get('policy') or {}
          stats=p.get('stats') or {}
          candidates=momentum + thesis

          print('INV version:', p.get('version'))
          print('Status:', p.get('status'))
          print('Universe coverage:', f"{universe.get('scanned')}/{universe.get('requested')} ({universe.get('coveragePct')}%)")
          print('Momentum seeds/deep:', stats.get('momentumSeeds'), stats.get('momentumDeepAnalyzed'))
          print('Thesis seeds/deep/underwritten:', stats.get('thesisSeeds'), stats.get('thesisDeepAnalyzed'), stats.get('thesisUnderwritten'))
          print('Momentum:', [(x.get('ticker'),x.get('state'),x.get('score'),x.get('lifecycleStage')) for x in momentum[:10]])
          print('Thesis:', [(x.get('ticker'),x.get('state'),x.get('score'),x.get('theme')) for x in thesis[:10]])
          print('Combined:', [(x.get('ticker'),x.get('lanes'),x.get('state'),x.get('score')) for x in combined[:10]])

          if not str(p.get('version','')).startswith('40.'):
              print('FAIL: endpoint is not INV Research V40.')
              sys.exit(20)
          if p.get('status') != 'READY':
              print('FAIL: INV Research V40 is not READY.')
              sys.exit(29)
          if str(policy.get('strategyVersion') or '') != str(p.get('version') or ''):
              print('FAIL: policy strategyVersion does not match the response version.')
              sys.exit(30)

          approved = set(policy.get('approvedAutomaticUniverse') or [])
          required_universe = {'S&P 500', 'Nasdaq-100', 'Russell 2000'}
          if approved != required_universe:
              print('FAIL: approved automatic universe changed unexpectedly:', sorted(approved))
              sys.exit(31)
          if int(universe.get('scanned') or 0) <= 0 or int(universe.get('requested') or 0) <= 0:
              print('FAIL: V40 returned no measured universe coverage.')
              sys.exit(32)
          if float(universe.get('coveragePct') or 0) < 80:
              print('FAIL: full-universe discovery coverage below 80%.')
              sys.exit(21)

          if policy.get('researchOnly') is not True:
              print('FAIL: researchOnly safeguard is missing.')
              sys.exit(33)
          if policy.get('humanApprovalRequired') is not True:
              print('FAIL: human approval safeguard is missing.')
              sys.exit(34)

          required_technical = {
              'asOf', 'maxAgeMinutes', 'ema8', 'ema13', 'ema100',
              'ema200', 'adx', 'macd', 'macdSignal', 'macdHistogram'
          }
          for candidate in candidates:
              ticker = candidate.get('ticker') or 'UNKNOWN'
              validation = candidate.get('technicalValidation') or {}
              eligible = validation.get('eligible') is True
              buy_ready = candidate.get('buyAlertEligible') is True
              alert_ready = candidate.get('alertState') == 'BUY_TRIGGER_READY'

              if not isinstance(candidate.get('buyAlertEligible'), bool):
                  print(f'FAIL: {ticker} buyAlertEligible is not boolean.')
                  sys.exit(35)
              if buy_ready != eligible or buy_ready != alert_ready:
                  print(f'FAIL: {ticker} buy-alert state disagrees with technical eligibility.')
                  sys.exit(36)

              if not buy_ready:
                  continue

              technical = candidate.get('technical') or {}
              missing = sorted(required_technical - set(technical))
              if missing:
                  print(f'FAIL: {ticker} buy-ready signal is missing technical fields: {missing}')
                  sys.exit(37)
              if candidate.get('technicalTimeframe') != '1d':
                  print(f'FAIL: {ticker} buy-ready signal is not aligned to daily timeframe.')
                  sys.exit(38)
              if validation.get('freshness') != 'FRESH' or validation.get('reasons'):
                  print(f'FAIL: {ticker} buy-ready signal is stale or has failed technical gates.')
                  sys.exit(39)

              ema8 = float(technical['ema8'])
              ema13 = float(technical['ema13'])
              ema100 = float(technical['ema100'])
              ema200 = float(technical['ema200'])
              adx = float(technical['adx'])
              macd = float(technical['macd'])
              macd_signal = float(technical['macdSignal'])
              macd_histogram = float(technical['macdHistogram'])
              if not (
                  ema8 > ema13 and
                  ema100 > ema200 and
                  adx >= 20 and
                  macd > macd_signal and
                  macd_histogram > 0
              ):
                  print(f'FAIL: {ticker} buy-ready signal bypassed an EMA/ADX/MACD gate.')
                  sys.exit(40)

          print(f'Validated {len(candidates)} V40 candidates; buy-ready signals are fresh and pass every technical gate.')
          if int(stats.get('momentumSeeds') or 0) <= 0 or not momentum:
              print('FAIL: Momentum Hunt returned no discoverable candidates.')
              sys.exit(22)
          if int(stats.get('thesisSeeds') or 0) <= 0 or int(stats.get('thesisDeepAnalyzed') or 0) <= 0:
              print('FAIL: Thesis Hunt did not run its seed/deep research lane.')
              sys.exit(23)
          if not thesis:
              print('FAIL: Thesis Hunt returned no research candidates.')
              sys.exit(24)
          if not combined:
              print('FAIL: Combined Ideas returned no candidates.')
              sys.exit(25)
          if policy.get('discoveryRequiresValuation') is not False:
              print('FAIL: Discovery is still blocked by valuation.')
              sys.exit(26)
          if policy.get('committeeReadyRequiresValuation') is not True:
              print('FAIL: Committee-ready valuation safeguard is missing.')
              sys.exit(27)
          if policy.get('automaticTrading') is not False:
              print('FAIL: Research must never auto-trade.')
              sys.exit(28)

          # The critical user-facing invariant: research visibility is broader
          # than capital authorization. A discovery lane can contain names not
          # yet committee-ready without hiding them.
          visible_non_committee = [x for x in momentum + thesis if not x.get('committeeReady')]
          if not visible_non_committee:
              print('WARN: all returned candidates happen to be committee-ready today; policy still proves discovery does not require valuation.')

          print('PASS: Production INV V40 preserves discovery coverage, strict technical buy-alert gates, and human-only authorization.')
          PY