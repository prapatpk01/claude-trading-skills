name: Sentinel Quality Gate

on:
  push:
    branches: [main]
    paths:
      - "webapp/**"
      - ".github/workflows/sentinel-quality.yml"
  pull_request:
    branches: [main]
    paths:
      - "webapp/**"
      - ".github/workflows/sentinel-quality.yml"
  workflow_dispatch:

concurrency:
  group: sentinel-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Validate, typecheck and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: webapp

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: webapp/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Institutional validation
        run: npm run validate:institutional

      - name: Runtime safety audit
        run: npm run audit:safety

      - name: Decision Authority V22 three-round simulation
        run: npm run test:authority-v22

      - name: Research OS V23 lifecycle simulation
        run: npm run test:research-v23

      - name: Research OS V25 lifecycle-first policy
        run: |
          npx tsc lib/research/momentumLifecycle.ts lib/research/lifecycleDiscoveryPolicy.ts --outDir .test-build-research-v25 --module commonjs --target es2022 --skipLibCheck --esModuleInterop
          node scripts/test-research-v25.mjs .test-build-research-v25
          rm -rf .test-build-research-v25

      - name: Momentum Forecast V26 probability policy
        run: npm run test:technical-overlay

      - name: TradingView Earnings Intelligence V30
        run: npm run test:tradingview-v30

      - name: TypeScript check
        run: npm run typecheck

      - name: Production build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
          NEXT_PUBLIC_SUPABASE_URL: "https://example.supabase.co"
          NEXT_PUBLIC_SUPABASE_ANON_KEY: "ci-placeholder-key"

      - name: Upload build diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: sentinel-quality-diagnostics-${{ github.run_id }}
          path: |
            webapp/.next
            webapp/npm-debug.log
          if-no-files-found: ignore
          retention-days: 7
