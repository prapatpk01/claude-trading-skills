name: Sentinel Quality Gate

on:
  push:
    branches: [main]
    paths:
      - "webapp/**"
      - ".github/workflows/sentinel-quality.yml"
  pull_request:
    branches: [main]
    paths:
      - "webapp/**"
      - ".github/workflows/sentinel-quality.yml"
  workflow_dispatch:

concurrency:
  group: sentinel-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Validate, typecheck and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: webapp

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: webapp/package-lock.json

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Institutional validation
        run: npm run validate:institutional

      - name: Runtime safety audit
        run: npm run audit:safety

      - name: TypeScript check
        run: npm run typecheck

      - name: Production build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
          NEXT_PUBLIC_SUPABASE_URL: "https://example.supabase.co"
          NEXT_PUBLIC_SUPABASE_ANON_KEY: "ci-placeholder-key"

      - name: Upload build diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: sentinel-quality-diagnostics-${{ github.run_id }}
          path: |
            webapp/.next
            webapp/npm-debug.log
          if-no-files-found: ignore
          retention-days: 7
