name: Sentinel INV Production E2E

on:
  push:
    branches: ['test/inv-production-e2e']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inv-production-meeting:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Run real INV meeting scan on Railway
        env:
          URL: https://claude-trading-skills-production.up.railway.app/api/committee/meeting
        shell: bash
        run: |
          set -euo pipefail
          code=$(curl -sS -L --connect-timeout 10 --max-time 100 -o /tmp/meeting.json -w '%{http_code}' "$URL")
          echo "HTTP $code"
          test "$code" = "200"
          python - <<'PY'
          import json, sys
          from pathlib import Path
          data=json.loads(Path('/tmp/meeting.json').read_text())
          scan=data.get('scan') or {}
          research=scan.get('researchOS') or {}
          sentinel=data.get('sentinelV36') or {}
          proposals=data.get('proposals') or []
          print('SCAN_OBJECT=', json.dumps(scan, ensure_ascii=False, indent=2)[:16000])
          print('SENTINEL_CANDIDATES=', [(x.get('ticker'), x.get('action'), x.get('score')) for x in (sentinel.get('candidates') or [])])
          print('PROPOSALS=', [(x.get('ticker'), x.get('expectedReturnPct'), x.get('researchStatus'), x.get('lifecycleStage')) for x in proposals])

          # Normalize the fields used by the UI across V32.x payload revisions.
          def first_num(obj, names):
              for n in names:
                  v=obj.get(n) if isinstance(obj,dict) else None
                  if isinstance(v,(int,float)): return float(v)
              return None
          universe=first_num(research,['masterUniverse','universe','universeSize','approvedUniverse','requested'])
          screened=first_num(research,['screened','fastScreened','stageAScreened','scanned'])
          coverage=first_num(research,['coveragePct','screenCoveragePct','stageACoveragePct','fastScreenCoveragePct'])
          deep=first_num(research,['deepResearch','deepResearched','deepResearchCount','stageBDeepResearch'])
          candidates=first_num(research,['candidates','candidateCount','qualifiedCandidates'])
          print('NORMALIZED_RESEARCH', {'universe':universe,'screened':screened,'coverage':coverage,'deepResearch':deep,'candidates':candidates})

          # If summary fields move, recursively find Stage A/B numeric evidence.
          numeric=[]
          def walk(x,path='scan'):
              if isinstance(x,dict):
                  for k,v in x.items():
                      p=f'{path}.{k}'
                      if isinstance(v,(int,float)) and any(t in k.lower() for t in ['screen','coverage','universe','research','candidate','scanned','requested']): numeric.append((p,float(v)))
                      walk(v,p)
              elif isinstance(x,list):
                  for i,v in enumerate(x): walk(v,f'{path}[{i}]')
          walk(scan)
          print('SCAN_NUMERIC_EVIDENCE=', numeric)

          positive_pipeline=len(sentinel.get('candidates') or [])>0 and len(proposals)>0
          full_scan=any(('screen' in p.lower() or 'scanned' in p.lower()) and v>0 for p,v in numeric)
          good_coverage=any('coverage' in p.lower() and v>=80 for p,v in numeric)
          if not positive_pipeline:
              print('FAIL: INV produced no candidates/proposals')
              sys.exit(2)
          if not full_scan:
              print('FAIL: no non-zero Stage A scan count in meeting diagnostics')
              sys.exit(3)
          if not good_coverage:
              print('FAIL: no >=80% Stage A coverage evidence in meeting diagnostics')
              sys.exit(4)
          print('PASS: INV full-universe Stage A -> deep research -> candidate proposal pipeline works in Railway production')
          PY
