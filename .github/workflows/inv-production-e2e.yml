name: Sentinel INV Production E2E

on:
  push:
    branches: ['test/inv-production-e2e']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inv-production-meeting:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Run real INV meeting and Stage 06 smoke test on Railway
        env:
          URL: https://claude-trading-skills-production.up.railway.app/api/committee/meeting
        shell: bash
        run: |
          set -euo pipefail
          code=$(curl -sS -L --connect-timeout 10 --max-time 100 -o /tmp/meeting.json -w '%{http_code}' "$URL")
          echo "HTTP $code"
          test "$code" = "200"
          python - <<'PY'
          import json, sys
          from pathlib import Path

          data=json.loads(Path('/tmp/meeting.json').read_text())
          scan=data.get('scan') or {}
          research=scan.get('researchOS') or {}
          sentinel=data.get('sentinelV36') or {}
          proposals=data.get('proposals') or []
          motions=data.get('motions') or []
          capital=data.get('capitalPlan') or {}
          blotter=data.get('blotter') or []

          print('MEETING_ID=', data.get('meetingId'))
          print('SCAN_STATUS=', scan.get('status'))
          print('RESEARCH_FAST_SCAN=', json.dumps(research.get('fastScan') or {}, ensure_ascii=False))
          print('SENTINEL_CANDIDATES=', [(x.get('ticker'), x.get('action'), x.get('score')) for x in (sentinel.get('candidates') or [])])
          print('PROPOSALS=', [(x.get('ticker'), x.get('expectedReturnPct')) for x in proposals])

          def all_pass(m):
              gates=m.get('decisionGates') or []
              return len(gates) >= 4 and all(g.get('status') == 'PASS' for g in gates)

          new_buys=[]
          for m in motions:
              if m.get('kind') == 'NEW BUY':
                  row={
                    'ticker':m.get('ticker'),
                    'outcome':m.get('outcome'),
                    'sizeUsd':m.get('sizeUsd'),
                    'approxShares':m.get('approxShares'),
                    'allPass':all_pass(m),
                    'gates':[(g.get('stage'),g.get('status')) for g in (m.get('decisionGates') or [])],
                    'reason':m.get('outcomeReason'),
                  }
                  new_buys.append(row)
          print('NEW_BUY_MOTIONS=', json.dumps(new_buys, ensure_ascii=False))

          temporary=float(capital.get('temporaryParkingUsd') or 0)
          deployable=float(capital.get('deployableSourcesUsd') or 0)
          print('CAPITAL=', {
            'deployableSourcesUsd':deployable,
            'usesUsd':capital.get('usesUsd'),
            'temporaryParkingUsd':temporary,
            'funded':capital.get('funded'),
            'allocationComplete':capital.get('allocationComplete'),
            'approvalReady':capital.get('approvalReady'),
          })
          print('DESTINATIONS=', [(x.get('category'),x.get('label'),x.get('amountUsd')) for x in (capital.get('destinationLines') or [])])
          print('BLOTTER=', [(x.get('side'),x.get('ticker'),x.get('approxUsd'),x.get('approxShares')) for x in blotter])

          # Mirrors CIOCommandCenterV351 carriedAction()/approvalMotions exactly.
          approval_motions=[m for m in motions if m.get('outcome')=='CARRIED' and m.get('kind')!='HOLD' and abs(float(m.get('sizeUsd') or 0))>0]
          print('STAGE06_APPROVAL_MOTIONS=', [(m.get('kind'),m.get('ticker'),m.get('sizeUsd'),m.get('approxShares')) for m in approval_motions])

          # INV full-universe proof remains mandatory.
          fast=research.get('fastScan') or {}
          screened=float(fast.get('scanned') or research.get('screenedUniverseSize') or scan.get('screenedUniverseSize') or 0)
          coverage=float(fast.get('coveragePct') or research.get('screenCoveragePct') or scan.get('screenCoveragePct') or 0)
          if screened <= 0 or coverage < 80:
              print(f'FAIL: INV Stage A unhealthy: screened={screened}, coverage={coverage}')
              sys.exit(2)
          if not proposals:
              print('FAIL: this production meeting produced no INV proposals, so Stage 06 NEW BUY handoff cannot be exercised')
              sys.exit(3)

          # V36.4 invariant: never park usable dollars while a NEW BUY is deferred
          # solely for funding after every authority gate already passed.
          funding_only_deferred=[m for m in new_buys if m['allPass'] and m['outcome']=='DEFERRED' and 'fund' in str(m['reason'] or '').lower()]
          if funding_only_deferred and temporary >= 25:
              print('FAIL: qualified NEW BUY remains funding-deferred while deployable dollars are parked', funding_only_deferred, temporary)
              sys.exit(4)

          # Every carried NEW BUY must be represented consistently all the way to Stage 06.
          carried_new=[m for m in new_buys if m['outcome']=='CARRIED' and float(m['sizeUsd'] or 0)>0]
          destinations=capital.get('destinationLines') or []
          for m in carried_new:
              t=m['ticker']
              amount=float(m['sizeUsd'] or 0)
              if not any(d.get('category')=='NEW_INVESTMENT' and t in str(d.get('label') or '') and abs(float(d.get('amountUsd') or 0)-amount)<0.02 for d in destinations):
                  print('FAIL: carried NEW BUY missing NEW_INVESTMENT destination', t, amount)
                  sys.exit(5)
              if not any(b.get('side')=='BUY' and b.get('ticker')==t and abs(float(b.get('approxUsd') or 0)-amount)<0.02 for b in blotter):
                  print('FAIL: carried NEW BUY missing BUY blotter line', t, amount)
                  sys.exit(6)
              if not any(a.get('ticker')==t and a.get('kind')=='NEW BUY' for a in approval_motions):
                  print('FAIL: carried NEW BUY missing from Stage 06 approval motions', t)
                  sys.exit(7)

          # When the current cycle has at least one all-PASS NEW BUY and deployable
          # capital exists, Stage 06 must expose at least one actionable line.
          qualified=[m for m in new_buys if m['allPass']]
          if qualified and deployable >= 25 and not approval_motions:
              print('FAIL: qualified NEW BUY + deployable capital exists but Stage 06 has zero approval lines')
              sys.exit(8)

          print('PASS: Production INV scan and Stage 06 Human Plan Approval funding handoff are coherent')
          PY