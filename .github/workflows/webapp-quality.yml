name: Sentinel Webapp Quality

on:
  push:
    branches: [main]
    paths:
      - "webapp/**"
      - ".github/workflows/webapp-quality.yml"
  pull_request:
    paths:
      - "webapp/**"
      - ".github/workflows/webapp-quality.yml"

concurrency:
  group: sentinel-webapp-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: webapp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: webapp/package-lock.json
      - run: npm ci
      - run: npm run validate:institutional
      - run: npm run typecheck
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
