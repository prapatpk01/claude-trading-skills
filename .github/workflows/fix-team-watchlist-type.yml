name: Fix team watchlist row type

on:
  push:
    paths:
      - '.github/workflows/fix-team-watchlist-type.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Patch inferred never array
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('webapp/app/api/team/route.ts')
          s = p.read_text()
          old = '      const rows = [];\n'
          new = '      const rows: any[] = [];\n'
          if old not in s:
              raise SystemExit('target line not found')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Commit fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add webapp/app/api/team/route.ts
          git commit -m 'fix(types): type watchlist analysis rows' || exit 0
          git push origin main
